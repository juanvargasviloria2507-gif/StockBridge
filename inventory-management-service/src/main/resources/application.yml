spring:
  application:
    name: inventory-management-service
  datasource:
    url: "${DB_URL:jdbc:h2:mem:inventorydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}"
    driver-class-name: "${DB_DRIVER:org.h2.Driver}"
    username: "${DB_USERNAME:sa}"
    password: "${DB_PASSWORD:}"
  jpa:
    database-platform: "${JPA_DIALECT:org.hibernate.dialect.H2Dialect}"
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081

app:
  jwt:
    # Development-only default; replace JWT_SECRET with a private Base64 key in deployed environments.
    secret: "${JWT_SECRET:c3RvY2ticmlkZ2UtZGV2ZWxvcG1lbnQtc2VjcmV0LWtleS0zMi1ieXRlcyE=}"
    expiration-ms: "${JWT_EXPIRATION_MS:3600000}"

supplier:
  availability:
    url: "${SUPPLIER_AVAILABILITY_URL:http://localhost:8082/api/suppliers/check-availability}"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

info:
  app:
    name: StockBridge Inventory Management Service
    version: 0.0.1-SNAPSHOT
